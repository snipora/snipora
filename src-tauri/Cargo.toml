[package]
name = "snipora"
description = "Snipora is a lightweight, local-first snippet manager for fast capture, simple organization, and quick search, keeping everyday text at your fingertips."
authors = ["snipora"]
homepage = "https://github.com/snipora"
edition = "2021"

[lib]
name = "snipora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
rust-i18n = "4.1.0"
uuid = { version = "1.23.3", features = ["v7"] }
time = "0.3.49"
arboard = { version =  "3.6.1" }
sys-locale = "0.3.2"
log = "0.4.32"
log-panics = { version =  "2.1.0", features = ["with-backtrace"] }
enigo = { version = "0.6.1", features = ["x11rb", "xdo", "wayland"] }
