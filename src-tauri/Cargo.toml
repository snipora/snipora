[package]
name = "snipora"
description = "Snipora is a lightweight, local-first snippet manager for fast capture, simple organization, and quick search, keeping everyday text at your fingertips."
authors = ["snipora"]
homepage = "https://github.com/snipora"
edition = "2021"

[lib]
name = "snipora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
rust-i18n = "4.2.4"
uuid = { version = "1.28.0", features = ["v7"] }
time = "0.3.55"
arboard = { version =  "3.7.0" }
sys-locale = "0.3.2"
log = "0.4.34"
log-panics = { version =  "2.1.0", features = ["with-backtrace"] }
enigo = { version = "0.6.1", features = ["x11rb", "xdo", "wayland"] }
