name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open snipora
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Snipora Version
      description: What version of snipora are you running? (e.g. x.y.z)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. Windows 11, macOS 14, Ubuntu 24.04
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Logs
        Log files are located in the app data directory under `com.snipora.snipora/logs/`:
        - **Linux**: `~/.local/share/com.snipora.snipora/logs/`
        - **macOS**: `~/Library/Application Support/com.snipora.snipora/logs/`
        - **Windows**: `%APPDATA%/com.snipora.snipora/logs/`

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: If applicable, paste any relevant log output from the log files above.
      render: shell
