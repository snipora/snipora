changelog:
  header: |
    ## What's changed
  body: |
    {% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    
    {% for commit in commits -%}
      {% if commit.remote.pr_title -%}
        {%- set commit_message = commit.remote.pr_title -%}
      {%- else -%}    
        {%- set commit_message = commit.message -%}
      {%- endif -%}
    * {{ commit_message | escape_xml }}
      {%- if commit.remote.pr_number -%}
        in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})
      {%- endif %}
    {% endfor -%}
    {% endfor -%}
    
    {% if github -%}
    {% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
      ### New Contributors
    {% endif -%}
    {% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
      * @{{ contributor.username }} made their first contribution
        {%- if contributor.pr_number -%}
          in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }})
        {%- endif %}
    {% endfor -%}
    {% endif -%}
    
    {% if version -%}
      {% if previous.version %}
        **Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}    
      {% endif %}
    {% endif -%}
    
    {%- macro remote_url() -%}
      https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
    {%- endmacro -%}
trim: true
git:
  conventional_commits: true
  filter_unconventional: true
  commit_parsers:
    - field: "author.name"
      pattern: github-actions\[bot\]
      skip: true
    - body: "BREAKING CHANGE:"
      group: <!-- 01 -->Breaking Changes
    - message: "^.+!:"
      group: <!-- 01 -->Breaking Changes
    - message: ^feat
      group: <!-- 02 -->Features
    - message: ^fix
      group: <!-- 03 -->Fixes
    - message: ^refactor
      group: <!-- 04 -->Refactors
    - message: ^perf
      group: <!-- 05 -->Performance
    - message: ^docs
      group: <!-- 06 -->Documentation
    - message: ^build
      group: <!-- 07 -->Build
    - message: ^ci
      group: <!-- 08 -->CI
    - message: ^test
      group: <!-- 09 -->Tests
    - message: .*
      group: <!-- 10 -->Other
  link_parsers:
    - pattern: "#(\\d+)"
      href: "https://github.com/snipora/snipora/issues/$1"
