sidebar:
  new-snippet:
    label: New Snippet
  global-search:
    label: Search Snippets
  all-snippets:
    label: All Snippets
  untagged:
    label: Untagged
  settings:
    label: Settings
setting:
  general:
    title: General
    startup:
      label: Launch at Startup
      description: Automatically launch Snipora when you log in to your computer
    shortcut:
      label: Search Popup Shortcut
      description: Select the shortcut you want to use to open the search popup
      placeholder: Ctrl+Shift+Space
    snippet-usage-behavior:
      label: Snippet Usage Behavior
      description: Choose how snippets are used
      copy-to-clipboard:
        label: Copy to Clipboard
        description: Copies the snippet content directly into your clipboard
        tooltip: You will need to manually paste the snippet
      simulate-paste:
        label: Simulate Paste
        description: Automatically pastes the snippet (coming soon)
      natural-typing:
        label: Natural Typing
        description: Types the snippet as if you were typing it
        tooltip: Keystroke injection depends on system and target app compatibility; behavior may vary
  appearance:
    title: Appearance
    show-tag-counts:
      label: Tag Count in Sidebar
      description: Show number of snippets next to each tag
    tray-icon-theme:
      label: Tray Icon Theme
      description: Choose how the tray icon appears
      options:
        app-icon: Snipora Logo
        light: Icon Light
        dark: Icon Dark
    ui-theme:
      label: UI Theme
      description: Choose the application theme
      options:
        system: System
        light: Light
        dark: Dark
  updates:
    title: Updates
    auto-check-updates:
      label: Check for Updates Automatically
      description: Periodically check for new versions of Snipora
    manual-check:
      label: Check for Updates
      description: Manually check if a new version of Snipora is available
      button: Check
  info:
    title: Info
    version:
      label: App Version
      description: Current version of Snipora
    runtime:
      label: Runtime Info
      description: Operating system, architecture and bundle type
updater:
  update-available:
    title: Update {version} available
    description: "Current version: {currentVersion}"
    action: Download
  downloading:
    title: Downloading update...
  checking-failed:
    title: Update check failed
    description: |
      An error occurred while checking for updates. Please try again.
      ({error})
  download-failed:
    title: Download failed
    description: |
      The update could not be downloaded. Please try again.
      ({error})
  ready-to-install:
    title: Ready to install {version}
    description: The update has been downloaded and is ready to install.
    action: Install & Restart
  install-failed:
    title: Installation failed
    description: |
      The update could not be installed. Please try again.
      ({error})
  installed:
    title: Update installed
    description: Version {version} has been installed. Restart to apply the update.
    action: Restart Now
context-menu:
  tag:
    view: View Snippets
    rename: Rename Tag
    delete: Delete Tag
dialog:
  action:
    cancel: Cancel
    create: Create
    save: Save
    delete: Delete
  new-snippet:
    dialog-title: Create New Snippet
    dialog-description: Add a new snippet to your collection.
    form:
      label-placeholder: Enter a descriptive label
      snippet-placeholder: Paste your snippet content here
      tags-placeholder: Add tags...
    error:
      title: Unable to create snippet
  edit-snippet:
    dialog-title: Edit Snippet
    dialog-description: Update the snippet data.
    form:
      label-placeholder: Enter a descriptive label
      snippet-placeholder: Paste your snippet content here
      tags-placeholder: Add tags...
    error:
      title: Unable to update snippet
  delete-snippet:
    dialog-title: Delete Snippet
    dialog-description: Are you sure you want to delete this snippet? This action cannot be undone.
  rename-tag:
    dialog-title: Rename Tag
    rename-description: Rename this tag
    merge-description: Merge all snippets into existing "{tag}"
    input-placeholder: New tag name...
    rename: Rename
    merge: Merge
  delete-tag:
    dialog-title: Delete Tag
    dialog-description: Are you sure you want to delete this tag? This will remove it from all snippets.
popup:
  input:
    placeholder: Search for snippets...
component:
  no-snippets:
    title: Nothing here yet
    description: Start adding snippets to see them appear
  something-went-wrong:
    title: Something went wrong
    description: This shouldn't have happened.
  tags-input-with-completion:
    no-tags: No Tags
